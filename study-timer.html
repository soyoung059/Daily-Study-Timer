<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Study Timer</title>
  <style>
    :root {
      --bg-color: #f3f6ff;
      --card-color: #ffffff;
      --text-color: #222222;
      --sub-text-color: #666666;
      --btn-color: #5b6cff;
      --btn-text-color: #ffffff;
    }

    .dark-mode {
      --bg-color: #0f172a;
      --card-color: #1e293b;
      --text-color: #f1f5f9;
      --sub-text-color: #cbd5e1;
      --btn-color: #8b5cf6;
      --btn-text-color: #ffffff;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.5s, color 0.5s;
    }

    .timer-container {
      background-color: var(--card-color);
      width: 340px;
      padding: 40px 35px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }

    .timer-display { font-size: 64px; font-weight: bold; margin: 18px 0; }
    
    .button-group { display: flex; justify-content: space-between; margin-bottom: 15px; }
    
    button {
      flex: 1; margin: 0 5px; padding: 12px 0; border: none; border-radius: 12px;
      background-color: var(--btn-color); color: var(--btn-text-color); cursor: pointer;
    }

    #darkModeBtn { width: 100%; margin-top: 10px; }
    .total-time { color: var(--sub-text-color); margin-top: 20px; }
  </style>
</head>
<body>

  <div class="timer-container">
    <h1 class="timer-title">Daily Study Timer</h1>
    <div id="timerDisplay" class="timer-display">00:00</div>

    <div class="button-group">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <button id="darkModeBtn">🌙 Dark Mode</button>
    <div id="totalTimeDisplay" class="total-time">Today's Study Time: 00:00</div>
  </div>

  <script>
    class DailyTimer {
        constructor() {
            this.timerInterval = null;
            this.elapsedSeconds = 0;
            this.isTimerRunning = false;
            
            this.todayKey = new Date().toISOString().split("T")[0];
            this.studyData = JSON.parse(localStorage.getItem("studyData")) || {};
            if (!this.studyData[this.todayKey]) this.studyData[this.todayKey] = 0;

            this.initElements();
            this.updateDisplay();
        }

        initElements() {
            this.timerDisplay = document.getElementById("timerDisplay");
            this.totalTimeDisplay = document.getElementById("totalTimeDisplay");
            document.getElementById("startBtn").onclick = () => this.start();
            document.getElementById("pauseBtn").onclick = () => this.pause();
            document.getElementById("resetBtn").onclick = () => this.reset();
            document.getElementById("darkModeBtn").onclick = () => this.toggleDarkMode();
        }

        formatTime(seconds) {
            const min = String(Math.floor(seconds / 60)).padStart(2, "0");
            const sec = String(seconds % 60).padStart(2, "0");
            return `${min}:${sec}`;
        }

        updateDisplay() {
            this.timerDisplay.textContent = this.formatTime(this.elapsedSeconds);
            this.totalTimeDisplay.textContent = `Today's Study Time: ${this.formatTime(this.studyData[this.todayKey])}`;
        }

        tick() {
            this.elapsedSeconds++;
            this.studyData[this.todayKey]++;
            this.updateDisplay();
            localStorage.setItem("studyData", JSON.stringify(this.studyData));
        }

        start() {
            if (!this.isTimerRunning) {
                this.isTimerRunning = true;
                this.timerInterval = setInterval(() => this.tick(), 1000);
            }
        }

        pause() {
            clearInterval(this.timerInterval);
            this.isTimerRunning = false;
        }

        reset() {
            this.pause();
            this.elapsedSeconds = 0;
            this.updateDisplay();
        }

        toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const btn = document.getElementById("darkModeBtn");
            btn.textContent = document.body.classList.contains("dark-mode") ? "Light Mode" : "🌙 Dark Mode";
        }
    }

    new DailyTimer();
  </script>
</body>
</html>
